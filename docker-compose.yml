# Hạ tầng dev cho datvietso. Toàn bộ dữ liệu nằm trên MongoDB.
# Backend/frontend chạy native bằng Node trên host, chỉ database nằm trong container.
#   docker compose up -d
#   cd backend && npm run migrate:fresh   # tạo 19 collection + nạp dữ liệu mẫu
services:
  mongo:
    image: mongo:7
    container_name: dvs-mongo
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27017}:27017"
    # Chạy dạng single-node replica set để dùng được transactions + change streams.
    # Transactions là thứ thay cho các ràng buộc mà MySQL từng lo hộ (cấp phát tài
    # sản, xóa tài sản kèm cascade), nên ở đây là bắt buộc chứ không phải tùy chọn.
    command: ["--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo-data:/data/db
    healthcheck:
      # Lần chạy đầu sẽ tự rs.initiate(); các lần sau rs.status() đã ok nên không làm gì.
      test: >
        mongosh --quiet --eval "
          try { rs.status().ok }
          catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]}).ok }
        "
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  mongo-data:
